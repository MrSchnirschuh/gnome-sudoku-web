services:
  # ── Development ─────────────────────────────────────────────────────────────
  dev:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules          # anonymous volume prevents host overwrite
    ports:
      - "5173:5173"
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      - NODE_ENV=development

  # ── Production ──────────────────────────────────────────────────────────────
  prod:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    ports:
      - "8080:80"
    profiles:
      - prod
